<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>Usage Meter</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=20260615c" />
  </head>
  <body>
    <main class="widget-shell">
      <header class="widget-header">
        <div class="title-group">
          <h1>Limits</h1>
          <div class="status-anchor">
            <span
              id="overall-status"
              class="header-status status-pending"
              aria-label="Waiting for refresh"
              tabindex="0"
              title="Waiting for refresh"
            ></span>
          </div>
        </div>
        <button id="refresh-button" class="icon-button" aria-label="Refresh" title="Refresh">
          ↻
        </button>
      </header>
      <section id="accounts" class="account-list" aria-live="polite"></section>
    </main>

    <template id="account-template">
      <article class="account-row">
        <div class="account-meta">
          <span class="account-type"></span>
          <p class="account-name"></p>
        </div>
        <div class="account-right">
          <div class="limit-grid" aria-label="Usage limits">
            <div class="limit-window" data-window="5h">
              <div class="limit-topline">
                <span class="limit-label">5h</span>
                <span class="limit-value">--</span>
              </div>
              <p class="limit-reset">
                <span class="limit-countdown"></span>
                <span class="limit-separator">·</span>
                <span class="limit-time"></span>
              </p>
            </div>
            <div class="limit-window" data-window="week">
              <div class="limit-topline">
                <span class="limit-label">Week</span>
                <span class="limit-value">--</span>
              </div>
              <p class="limit-reset">
                <span class="limit-countdown"></span>
                <span class="limit-separator">·</span>
                <span class="limit-time"></span>
              </p>
            </div>
          </div>
          <p class="account-summary"></p>
          <button class="connect-button hidden">Connect</button>
        </div>
      </article>
    </template>

    <script src="app.js?v=20260615c" type="module"></script>
  </body>
</html>
