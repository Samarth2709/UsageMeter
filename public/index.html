<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>Usage Meter</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=20260902s" />
    <link rel="stylesheet" href="sculpture.css?v=20260904a" />
    <link rel="stylesheet" href="spatial.css?v=20260904g" />
    <link rel="stylesheet" href="notch.css?v=20260905a" />
  </head>
  <body>
    <div class="spatial-stage dock-enabled is-docked" tabindex="0" role="region" aria-label="3D usage meter" aria-description="Drag to turn, flick to spin, double-click or press Escape to face forward. Arrow keys rotate when this region is focused.">
      <div class="spatial-chassis">
        <div class="chassis-back" aria-hidden="true"><span>Usage Meter</span></div>
        <div class="chassis-volume" aria-hidden="true"></div>
        <main class="widget-shell notch-shell">
      <header class="sculpture-header" title="Drag to rotate">
        <h1>Usage Meter</h1>
        <span>Remaining</span>
      </header>
      <section id="accounts" class="account-list" aria-live="polite"></section>
      <footer class="widget-header widget-bar">
        <div class="status-anchor">
          <span
            id="overall-status"
            class="header-status status-pending"
            aria-label="Waiting for refresh"
            title="Waiting for refresh"
          ></span>
          <span id="overall-status-text" class="status-text">Waiting</span>
        </div>
        <div class="header-actions">
          <button id="update-pill" class="update-pill hidden" aria-live="polite" title="Update">
            Update
          </button>
          <button id="refresh-button" class="icon-button" aria-label="Refresh" title="Refresh">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" />
              <path d="M11.9 1.1v3h-3" />
            </svg>
          </button>
          <button id="history-button" class="icon-button" aria-label="Usage History" title="Usage History">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 13.5V9M8 13.5V3.5M13 13.5V6.5" />
            </svg>
          </button>
        </div>
      </footer>
        </main>
      </div>
      <span class="resize-edge" data-resize-edge="n" aria-hidden="true"></span>
      <span class="resize-edge" data-resize-edge="s" aria-hidden="true"></span>
      <span class="resize-edge" data-resize-edge="e" aria-hidden="true"></span>
      <span class="resize-edge" data-resize-edge="w" aria-hidden="true"></span>
      <span class="resize-edge" data-resize-edge="ne" aria-hidden="true"></span>
      <span class="resize-edge" data-resize-edge="nw" aria-hidden="true"></span>
      <span class="resize-edge" data-resize-edge="sw" aria-hidden="true"></span>
      <button class="resize-edge resize-grip" data-resize-edge="se" aria-label="Resize window" title="Drag to resize. Arrow keys resize when focused.">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="m5 12 7-7M9 12l3-3"/></svg>
      </button>
    </div>

    <template id="account-template">
      <article class="account-row" tabindex="0">
        <div class="meter-badge" aria-hidden="true">
          <div class="meter-ring">
            <span class="meter-glyph"></span>
          </div>
          <span class="meter-value">—</span>
        </div>
        <div class="account-meta">
          <span class="account-type"></span>
          <p class="account-name"></p>
        </div>
        <div class="account-right">
          <div class="limit-grid" aria-label="Usage limits"></div>
          <p class="account-summary"></p>
          <div class="account-actions hidden">
            <button class="connect-button">Sign in</button>
            <button class="delete-button">Delete</button>
          </div>
        </div>
      </article>
    </template>

    <template id="limit-window-template">
      <div class="limit-window">
        <div class="limit-topline">
          <span class="limit-label"></span>
          <span class="limit-value"></span>
        </div>
        <div class="allowance-track" aria-hidden="true"><div class="allowance-fill"></div></div>
        <p class="limit-reset">
          <span class="limit-countdown"></span>
          <span class="limit-time"></span>
        </p>
      </div>
    </template>

    <script src="update-state.js?v=20260718a"></script>
    <script src="spatial.js?v=20260904g" type="module"></script>
    <script src="app.js?v=20260904c" type="module"></script>
  </body>
</html>
